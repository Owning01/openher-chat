# Proxy X (OpenHer Chat). Rutas /x-api/* -> servicio local 8081.
# Requiere el certificado ya emitido para <SUBDOMINIO> (certbot).
limit_req_zone $binary_remote_addr zone=xapi:10m rate=30r/m;

server {
    listen 80;
    server_name <SUBDOMINIO>;

    location / {
        limit_req zone=zen burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /x-api/ {
        limit_req zone=xapi burst=10 nodelay;

        rewrite ^/x-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
