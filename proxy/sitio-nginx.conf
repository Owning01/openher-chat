# Proxy OpenCode (OpenHer Chat). HTTP hasta que certbot emita el TLS
# (requiere el registro A del <SUBDOMINIO> apuntando a este VPS).
# Límite por IP: 30 req/min con ráfaga de 10. Un chat normal hace 1 request
# por mensaje, así que esto solo frena martilleo automatizado.
limit_req_zone $binary_remote_addr zone=zen:10m rate=30r/m;

server {
    listen 80;
    server_name <SUBDOMINIO>;

    location / {
        limit_req zone=zen burst=10 nodelay;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE/streams sin buffer ni cortes
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
